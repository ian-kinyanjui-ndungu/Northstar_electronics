<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Wishlist — Northstar Electronics</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="page-wrapper" id="wishlistWrap" style="display:none">
    <div class="container">
      <div style="padding:36px 0 24px">
        <h1 style="margin-bottom:4px">My Wishlist</h1>
        <p class="text-secondary" id="wishlistSubtitle">Loading…</p>
      </div>
      <div class="product-grid" id="wishlistGrid">
        <div class="loading-overlay" style="grid-column:1/-1"><div class="spinner"></div> Loading…</div>
      </div>
    </div>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/js/app.js"></script>
  <script>
    async function loadWishlist() {
      if (!Auth.isLoggedIn()) { window.location.href = '/login?redirect=/wishlist'; return; }
      document.getElementById('wishlistWrap').style.display = 'block';
      try {
        const items = await api('/wishlist');
        const grid = document.getElementById('wishlistGrid');
        document.getElementById('wishlistSubtitle').textContent = `${items.length} saved item${items.length !== 1 ? 's' : ''}`;
        if (!items.length) {
          grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <h3>Your wishlist is empty</h3><p>Save products you love to revisit them later.</p>
            <a href="/products" class="btn btn-primary">Browse Products</a>
          </div>`;
          return;
        }
        grid.innerHTML = items.map(item => {
          const p = item.product;
          if (!p) return '';
          const img = p.image || productImageSVG(p.category);
          const inStock = p.stock > 0;
          return `
          <div class="card product-card">
            <img class="product-img" src="${img}" alt="${p.name}" onerror="this.src='${productImageSVG(p.category)}'" onclick="window.location='/product/${p.id}'"/>
            <div class="product-info">
              <p class="product-category">${p.category}</p>
              <h4 class="product-name" onclick="window.location='/product/${p.id}'" style="cursor:pointer">${p.name}</h4>
              <p class="product-price">${formatCurrency(p.price)}</p>
              <div class="flex-between" style="gap:8px;flex-wrap:wrap">
                <span class="stock-badge ${inStock ? 'in-stock' : 'out-of-stock'}">${inStock ? '● In Stock' : '● Out of Stock'}</span>
              </div>
              <div style="display:flex;gap:8px;margin-top:12px">
                <button class="btn btn-primary btn-sm" style="flex:1" ${inStock ? '' : 'disabled'} onclick="addToCart(${JSON.stringify(p).replace(/"/g,'&quot;')})">Add to Cart</button>
                <button class="btn btn-ghost btn-sm" onclick="removeFromWishlist(${p.id}, this)" title="Remove from wishlist">
                  <svg width="15" height="15" fill="currentColor" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
              </div>
            </div>
          </div>`;
        }).join('');
      } catch(e) {
        document.getElementById('wishlistGrid').innerHTML = '<p class="text-error" style="grid-column:1/-1">Could not load wishlist.</p>';
      }
    }

    function addToCart(p) {
      Cart.add(p);
      Toast.show(`${p.name} added to cart`, 'success');
    }

    async function removeFromWishlist(productId, btn) {
      try {
        await api(`/wishlist/${productId}`, { method: 'DELETE' });
        Toast.show('Removed from wishlist', 'info');
        loadWishlist();
      } catch(e) {
        Toast.show('Could not remove item', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadWishlist);
  </script>
</body>
</html>
