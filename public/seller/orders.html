<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seller Orders — Northstar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div id="sellerWrap" style="display:none">
    <div class="seller-layout">
      <aside class="seller-sidebar">
        <div class="seller-logo"><img src="/images/logo.png" alt="Northstar"/><span class="seller-label">Seller Portal</span></div>
        <nav class="seller-nav">
          <span class="nav-section">Dashboard</span>
          <a href="/seller/dashboard">Overview</a>
          <span class="nav-section">Store</span>
          <a href="/seller/products">My Products</a>
          <a href="/seller/orders" class="active">Orders</a>
          <a href="/seller/wallet">Wallet</a>
          <a href="/seller/analytics">Analytics</a>
          <span class="nav-section">Account</span>
          <a href="/seller/settings">Settings</a>
          <a href="/">← Back to Store</a>
          <button onclick="logout()">Sign Out</button>
        </nav>
      </aside>
      <main class="seller-main">
        <div style="margin-bottom:28px"><h2 style="font-size:1.4rem;margin-bottom:4px">Orders</h2><p class="text-secondary">View and manage all orders for your products</p></div>
        <div class="card">
          <div class="table-wrap" id="ordersTable"><div class="loading-overlay"><div class="spinner"></div></div></div>
        </div>
      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/js/app.js"></script>
  <script>
    async function load() {
      if (!Auth.isLoggedIn()) { window.location.href = '/login?redirect=/seller/orders'; return; }
      document.getElementById('sellerWrap').style.display = 'block';
      try {
        const orders = await api('/orders');
        const tbl = document.getElementById('ordersTable');
        if (!orders.length) { tbl.innerHTML = '<div style="padding:32px;text-align:center;color:var(--color-text-muted)">No orders yet</div>'; return; }
        tbl.innerHTML = `<table>
          <thead><tr><th>Order #</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th>Shipping To</th></tr></thead>
          <tbody>${orders.map(o => `<tr>
            <td style="font-weight:700">#${o.id}</td>
            <td style="font-size:0.85rem">${formatDate(o.createdAt)}</td>
            <td>${(o.items||[]).length}</td>
            <td style="font-weight:600">${formatCurrency(o.total)}</td>
            <td>${statusBadge(o.status)}</td>
            <td style="font-size:0.8rem;color:var(--color-text-secondary);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.shippingAddress || '—'}</td>
          </tr>`).join('')}</tbody>
        </table>`;
      } catch(e) { document.getElementById('ordersTable').innerHTML = '<p class="text-error" style="padding:16px">Could not load orders.</p>'; }
    }
    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
