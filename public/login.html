<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — Northstar Electronics</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .auth-page { min-height: calc(100vh - var(--nav-height)); display: flex; align-items: center; background: var(--color-surface); padding: 40px 0; }
    .auth-card { max-width: 420px; width: 100%; margin: 0 auto; padding: 0 16px; }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo img { height: 56px; width: auto; }
    .auth-title { font-size: 1.5rem; text-align: center; margin-bottom: 6px; }
    .auth-subtitle { text-align: center; color: var(--color-text-secondary); margin-bottom: 28px; font-size: 0.9rem; }
    .divider-or { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--color-text-muted); font-size: 0.8rem; }
    .divider-or::before, .divider-or::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/"><img src="/images/logo.png" alt="Northstar Electronics"/></a>
      </div>
      <div class="card">
        <div class="card-body" style="padding:32px">
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to your Northstar account.</p>

          <div id="errorMsg" class="alert alert-error hidden mb-16"></div>

          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
              <label class="form-label" for="email">Email Address</label>
              <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email"/>
            </div>
            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <div class="password-wrap">
                <input type="password" id="password" class="form-input" placeholder="Your password" required autocomplete="current-password"/>
                <button type="button" class="pw-toggle" onclick="togglePw('password', this)" tabindex="-1" aria-label="Show password">
                  <svg class="eye-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Sign In</button>
          </form>

          <div class="divider-or">or</div>
          <div style="background:var(--color-surface);border-radius:var(--radius-md);padding:14px 16px;font-size:0.8rem;color:var(--color-text-secondary)">
            <strong>Demo accounts:</strong><br/>
            Admin: <code>admin@northstar.com</code> / <code>admin123</code><br/>
            Customer: <code>alex@example.com</code> / <code>customer123</code>
          </div>

          <p style="text-align:center;margin-top:20px;font-size:0.875rem;color:var(--color-text-secondary)">
            Don't have an account? <a href="/signup">Sign up free</a>
          </p>
        </div>
      </div>
    </div>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/js/app.js"></script>
  <script>
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.querySelector('svg').innerHTML = isText
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    }

    // If already logged in, redirect
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) {
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('redirect') || (Auth.isAdmin() ? '/admin' : '/dashboard');
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('errorMsg');
      errorEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Signing in…';

      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }),
        });
        Auth.set(data.token, data.user);
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || (data.user.role === 'admin' ? '/admin' : '/dashboard');
        navigateWithSplash(redirect);
      } catch (err) {
        errorEl.textContent = err.message || 'Sign in failed. Check your credentials.';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    }
  </script>
</body>
</html>
