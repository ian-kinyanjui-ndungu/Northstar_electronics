<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — Northstar Electronics</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .auth-page { min-height: calc(100vh - var(--nav-height)); display: flex; align-items: center; background: var(--color-surface); padding: 40px 0; }
    .auth-card { max-width: 420px; width: 100%; margin: 0 auto; padding: 0 16px; }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo img { height: 56px; width: auto; }
    .auth-title { font-size: 1.5rem; text-align: center; margin-bottom: 6px; }
    .auth-subtitle { text-align: center; color: var(--color-text-secondary); margin-bottom: 28px; font-size: 0.9rem; }
    .perks { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .perk { display: flex; align-items: center; gap: 10px; font-size: 0.875rem; color: var(--color-text-secondary); }
    .perk svg { color: var(--color-success); flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/"><img src="/images/logo.png" alt="Northstar Electronics"/></a>
      </div>
      <div class="card">
        <div class="card-body" style="padding:32px">
          <h1 class="auth-title">Create an account</h1>
          <p class="auth-subtitle">Join Northstar and start shopping today.</p>

          <div class="perks">
            <div class="perk"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Track your orders in real-time</div>
            <div class="perk"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Request returns within 14 days</div>
            <div class="perk"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Exclusive member deals</div>
          </div>

          <div id="errorMsg" class="alert alert-error hidden mb-16"></div>
          <div id="successMsg" class="alert alert-success hidden mb-16"></div>

          <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
              <label class="form-label" for="name">Full Name</label>
              <input type="text" id="name" class="form-input" placeholder="Alex Johnson" required autocomplete="name"/>
            </div>
            <div class="form-group">
              <label class="form-label" for="email">Email Address</label>
              <input type="email" id="email" class="form-input" placeholder="you@example.com" required autocomplete="email"/>
            </div>
            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <div class="password-wrap">
                <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6"/>
                <button type="button" class="pw-toggle" onclick="togglePw('password', this)" tabindex="-1" aria-label="Show password">
                  <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirm Password</label>
              <div class="password-wrap">
                <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat your password" required/>
                <button type="button" class="pw-toggle" onclick="togglePw('confirmPassword', this)" tabindex="-1" aria-label="Show password">
                  <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" id="signupBtn">Create Account</button>
          </form>

          <p style="text-align:center;margin-top:20px;font-size:0.875rem;color:var(--color-text-secondary)">
            Already have an account? <a href="/login">Sign in</a>
          </p>
          <p style="text-align:center;margin-top:12px;font-size:0.78rem;color:var(--color-text-muted)">
            By creating an account you agree to our <a href="/return-policy">Terms & Return Policy</a>.
          </p>
        </div>
      </div>
    </div>
  </div>
  <div id="footer-placeholder"></div>
  <script src="/js/app.js"></script>
  <script>
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.querySelector('svg').innerHTML = isText
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) window.location.href = '/dashboard';
    });

    async function handleSignup(e) {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const errorEl = document.getElementById('errorMsg');
      const successEl = document.getElementById('successMsg');
      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Creating account…';

      try {
        const data = await api('/auth/signup', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password,
          }),
        });
        Auth.set(data.token, data.user);
        successEl.textContent = 'Account created! Redirecting…';
        successEl.classList.remove('hidden');
        setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
      } catch (err) {
        errorEl.textContent = err.message || 'Sign up failed. Please try again.';
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
      }
    }
  </script>
</body>
</html>
